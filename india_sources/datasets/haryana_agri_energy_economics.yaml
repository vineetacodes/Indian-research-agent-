# ==============================================================================
# BHARAT RESEARCH INTELLIGENCE AGENT (BRIA) — CROSS-DOMAIN DATASET BINDING
# ==============================================================================
# Study Domain: Haryana + Agriculture + Energy + Cold Storage + Economics
# Schema Version: 1.0.0
# Target Objective: Multi-variable synthesis for agricultural supply chain,
#                  power tariff economics, post-harvest infrastructure, and policy feasibility.
# ==============================================================================

study_meta:
  study_id: "in-har-agri-energy-storage-econ-v1"
  name: "Haryana Agricultural Energy, Post-Harvest Cold-Chain & Policy Economics"
  geographic_focus:
    state: "Haryana"
    state_code: "HR"
    districts:
      - "Karnal"
      - "Kurukshetra"
      - "Sonipat"
      - "Hisar"
      - "Sirsa"
      - "Ambala"
      - "Yamunanagar"
      - "Rohtak"
      - "Bhiwani"
      - "Jind"
  temporal_range:
    baseline_year: "2018-19"
    current_year: "2024-25"
    forecast_horizon: "2030-31"
  currency_unit: "INR"
  economic_units:
    crop_yield: "kg/hectare"
    production_volume: "Metric Tonnes (MT) / Lakh MT"
    cold_capacity: "Metric Tonnes (MT)"
    electricity_tariff: "INR/kWh (₹/Unit)"
    solar_capacity: "kW / MW"
    financial_figures: "Lakhs (₹1,00,000) & Crores (₹1,00,00,000)"

# ==============================================================================
# SELECTED DATASETS (A, B, C, D, E)
# ==============================================================================
datasets:

  # ----------------------------------------------------------------------------
  # DATASET A: HARYANA CROP PRODUCTION & YIELD DYNAMICS
  # ----------------------------------------------------------------------------
  - dataset_id: "DATASET_A_HARYANA_CROP_PRODUCTION"
    name: "Haryana District-Wise Crop Production, Area, Yield & Mandi Prices"
    source_registry_ref: "in-gov-ogd-datagov"
    custodian: "Directorate of Economics & Statistics (DES), MoA&FW & Haryana Department of Agriculture"
    priority_tier: "Tier-1"
    access_protocol:
      method: "REST_API"
      api_url: "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070"
      format: "JSON"
      auth_env_var: "OGD_INDIA_API_KEY"
      fallback_url: "https://agricoop.nic.in/en/StatAggregation"
    temporal_coverage: "2015-16 to 2023-24 (Annual & Seasonal)"
    granularity: "District-Level"
    schema_fields:
      - name: "state_name"
        type: "string"
        constant: "Haryana"
      - name: "district_name"
        type: "string"
        description: "Administrative district name"
      - name: "crop_year"
        type: "string"
        format: "YYYY-YY"
      - name: "season"
        type: "enum"
        allowed_values: ["Kharif", "Rabi", "Zaid", "Whole Year"]
      - name: "crop_category"
        type: "enum"
        allowed_values: ["Cereals", "Oilseeds", "Commercial", "Pulses", "Horticulture_Vegetables", "Horticulture_Fruits"]
      - name: "crop_name"
        type: "string"
        focal_crops: ["Wheat", "Paddy (Basmati)", "Paddy (Non-Basmati)", "Mustard", "Cotton", "Sugarcane", "Potato", "Tomato", "Onion", "Kinnow"]
      - name: "area_hectares"
        type: "float"
        unit: "Hectares"
      - name: "production_tonnes"
        type: "float"
        unit: "Metric Tonnes"
      - name: "yield_kg_per_hectare"
        type: "float"
        unit: "kg/ha"
      - name: "mandi_arrival_quintals"
        type: "float"
        unit: "Quintals (100 kg)"
      - name: "modal_price_rs_per_quintal"
        type: "float"
        unit: "INR/Quintal"
    validation_invariants:
      - "yield_kg_per_hectare == (production_tonnes * 1000) / area_hectares"
      - "area_hectares > 0"

  # ----------------------------------------------------------------------------
  # DATASET B: INDIAN & STATE-LEVEL COLD-STORAGE CAPACITY
  # ----------------------------------------------------------------------------
  - dataset_id: "DATASET_B_COLD_STORAGE_CAPACITY"
    name: "National & Haryana State-Wise Cold Storage Capacity & Utilization"
    source_registry_ref: "in-gov-ogd-datagov"
    custodian: "National Centre for Cold-chain Development (NCCD) / Ministry of Food Processing Industries (MoFPI)"
    priority_tier: "Tier-1"
    access_protocol:
      method: "REST_API_AND_STRUCTURED_DOWNLOAD"
      api_url: "https://api.data.gov.in/resource/state-wise-cold-storage-capacity"
      format: "JSON"
      auth_env_var: "OGD_INDIA_API_KEY"
      fallback_url: "https://nccd.gov.in/all-india-cold-chain-infrastructure"
    temporal_coverage: "2018 to 2024 (Annual Census)"
    granularity: "Facility-Level & District-Aggregated"
    schema_fields:
      - name: "state"
        type: "string"
        description: "State name (Filtered for Haryana & National Benchmark)"
      - name: "district"
        type: "string"
        description: "District location in Haryana"
      - name: "facility_name"
        type: "string"
      - name: "installed_capacity_mt"
        type: "float"
        unit: "Metric Tonnes"
      - name: "technology_type"
        type: "enum"
        allowed_values: ["Conventional_Vapour_Compression", "Controlled_Atmosphere_CA", "Modified_Atmosphere", "Multi_Chamber_Cold_Room"]
      - name: "storage_commodity_profile"
        type: "enum"
        allowed_values: ["Single_Commodity_Potato", "Multi_Commodity_Horticulture", "Dairy_Meat", "Pharma"]
      - name: "operational_months_per_year"
        type: "integer"
        description: "Seasonal operation (e.g., 6-9 months for potato vs 12 months for multi-commodity)"
      - name: "power_backup_source"
        type: "enum"
        allowed_values: ["Grid_Only", "Grid_Plus_Diesel_DG", "Grid_Plus_Solar_Rooftop", "Hybrid_Solar_DG"]
      - name: "specific_energy_consumption_kwh_per_mt_month"
        type: "float"
        unit: "kWh/MT/Month"
        typical_range: [15.0, 38.0]
    validation_invariants:
      - "installed_capacity_mt > 0"
      - "operational_months_per_year <= 12"

  # ----------------------------------------------------------------------------
  # DATASET C: ELECTRICITY PRICING & TARIFF STRUCTURES
  # ----------------------------------------------------------------------------
  - dataset_id: "DATASET_C_ELECTRICITY_PRICING_TARIFFS"
    name: "Haryana Electricity Regulatory Commission (HERC) Agricultural & Industrial Power Tariffs"
    source_registry_ref: "in-gov-ogd-datagov"
    custodian: "Haryana Electricity Regulatory Commission (HERC) / UHBVN & DHBVN Discoms"
    priority_tier: "Tier-1"
    access_protocol:
      method: "STRUCTURED_DOCUMENT_AND_TARIFF_SCHEDULE"
      api_url: "https://herc.gov.in/TariffOrders"
      format: "PDF_AND_STRUCTURED_JSON"
      auth_env_var: "NONE"
      fallback_url: "https://uhbvn.org.in/tariff_schedule"
    temporal_coverage: "FY 2020-21 to FY 2024-25"
    granularity: "Consumer-Category & Voltage-Level"
    schema_fields:
      - name: "discom_name"
        type: "enum"
        allowed_values: ["UHBVN_North", "DHBVN_South"]
      - name: "financial_year"
        type: "string"
        format: "FY YYYY-YY"
      - name: "consumer_category"
        type: "enum"
        allowed_values:
          - "AP_Agricultural_Pump_Metered"
          - "AP_Agricultural_Pump_Unmetered"
          - "LT_Commercial_Cold_Storage"
          - "HT_Industrial_Agro_Processing"
          - "Solar_Agricultural_Feeder_Supply"
      - name: "voltage_level_kv"
        type: "enum"
        allowed_values: ["LT_415V", "11kV", "33kV", "66kV_and_above"]
      - name: "fixed_charges_rs_per_kva_month"
        type: "float"
        unit: "INR/kVA/Month"
      - name: "energy_charges_rs_per_kwh"
        type: "float"
        unit: "INR/kWh"
      - name: "subsidized_effective_rate_rs_per_kwh"
        type: "float"
        unit: "INR/kWh (e.g. ₹0.15/kWh for agricultural tubewell vs ₹6.50/kWh for commercial cold storage)"
      - name: "time_of_day_solar_rebate_rs_per_kwh"
        type: "float"
        unit: "INR/kWh (Rebate during solar hours 08:00-16:00)"
      - name: "time_of_day_peak_surcharge_rs_per_kwh"
        type: "float"
        unit: "INR/kWh (Peak surcharge during 18:00-22:00)"
      - name: "fuel_surcharge_adjustment_fsa_rs_per_kwh"
        type: "float"
        unit: "INR/kWh"
    validation_invariants:
      - "subsidized_effective_rate_rs_per_kwh <= energy_charges_rs_per_kwh"

  # ----------------------------------------------------------------------------
  # DATASET D: RELEVANT INDIAN AGRICULTURAL & POST-HARVEST RESEARCH
  # ----------------------------------------------------------------------------
  - dataset_id: "DATASET_D_AGRICULTURAL_RESEARCH"
    name: "ICAR-CIPHET & CCS HAU Agronomic & Post-Harvest Storage Research"
    source_registry_ref: "in-agr-icar-krishi"
    custodian: "ICAR-Central Institute of Post-Harvest Engineering & Technology (CIPHET) / CCS Haryana Agricultural University"
    priority_tier: "Tier-2"
    access_protocol:
      method: "OAI_PMH_AND_REST"
      api_url: "https://krishi.icar.gov.in/rest/"
      format: "JSON_AND_FULLTEXT_PDF"
      auth_env_var: "NONE"
      fallback_url: "https://hau.ac.in/research-publications"
    temporal_coverage: "2016 to 2024"
    granularity: "Crop-Specific & Post-Harvest Node"
    schema_fields:
      - name: "study_doi_or_handle"
        type: "string"
      - name: "conducting_institution"
        type: "string"
        examples: ["ICAR-CIPHET Ludhiana", "CCS HAU Hisar", "ICAR-IARI New Delhi"]
      - name: "crop_commodity"
        type: "string"
      - name: "baseline_post_harvest_loss_pct_without_cold_chain"
        type: "float"
        unit: "Percentage (e.g., 6.7% for wheat, 12.4% for tomato, 8.2% for potato in North India)"
      - name: "post_harvest_loss_pct_with_cold_storage"
        type: "float"
        unit: "Percentage (e.g., reduced to 2.1% - 3.5%)"
      - name: "ambient_shelf_life_days"
        type: "float"
        unit: "Days"
      - name: "cold_storage_shelf_life_days"
        type: "float"
        unit: "Days (e.g., Potato 180-240 days at 2-4°C, Tomato 21-30 days at 10-12°C)"
      - name: "optimal_storage_temperature_celsius"
        type: "float"
        unit: "Celsius"
      - name: "optimal_relative_humidity_pct"
        type: "float"
        unit: "Percentage (85-95%)"
      - name: "water_consumption_liters_per_kg_crop"
        type: "float"
        unit: "Liters/kg (e.g. 3,500 L/kg for Paddy vs 800 L/kg for Maize vs 350 L/kg for Potato)"

  # ----------------------------------------------------------------------------
  # DATASET E: RELEVANT GOVERNMENT POLICIES & SCHEMES
  # ----------------------------------------------------------------------------
  - dataset_id: "DATASET_E_GOVERNMENT_POLICIES_SCHEMES"
    name: "Central & Haryana State Agri-Energy & Post-Harvest Policy Registry"
    source_registry_ref: "in-gov-pib-releases"
    custodian: "MNRE, MoFPI, Ministry of Agriculture & Haryana Dept of Agriculture"
    priority_tier: "Tier-1"
    access_protocol:
      method: "REST_API_AND_GAZETTE_NOTIFICATIONS"
      api_url: "https://pib.gov.in/RssMain.aspx"
      format: "JSON_AND_PDF"
      auth_env_var: "NONE"
      fallback_url: "https://mnre.gov.in/pm-kusum"
    temporal_coverage: "2019 to Present (Active Operational Guidelines)"
    granularity: "Scheme-Component Level"
    schemes_indexed:
      - scheme_id: "MNRE_PM_KUSUM"
        name: "Pradhan Mantri Kisan Urja Suraksha evam Utthaan Mahabhiyan (PM-KUSUM)"
        jurisdiction: "CENTRAL_AND_STATE_CO_FUNDED"
        components:
          - component_id: "PM_KUSUM_COMP_A"
            description: "Setting up 500kW to 2MW decentralized ground-mounted solar power plants on barren/agri land"
            tariff_benefit: "Feed-in Tariff (FiT) assured purchase by Discom at ₹3.11/kWh"
          - component_id: "PM_KUSUM_COMP_B"
            description: "Installation of standalone off-grid solar agricultural pumps (up to 10 HP)"
            subsidy_structure: "30% Central Financial Assistance (CFA) + 45% Haryana State Subsidy = 75% Total Subsidy (Farmer pays 25%)"
          - component_id: "PM_KUSUM_COMP_C"
            description: "Solarization of grid-connected agricultural pumps & feeder-level solarization"
            benefit: "Excess solar power fed back into grid at net-metered export rate"

      - scheme_id: "MOFPI_PM_SAMPADA_COLD_CHAIN"
        name: "Pradhan Mantri Kisan SAMPADA Yojana (PMKSY) — Integrated Cold Chain Scheme"
        jurisdiction: "CENTRAL"
        benefit_structure:
          grant_in_aid_percentage: "35% of eligible project cost in General areas (Haryana); 50% in Himalayan/Difficult areas"
          max_grant_ceiling_inr_crores: 10.0
          eligible_components: ["Packhouse", "Cold Storage Units", "Reefer Transport", "Pre-cooling Units", "Irradiation Facilities"]

      - scheme_id: "HAR_BHAVANTAR_BHARPAYEE"
        name: "Haryana Bhavantar Bharpayee Yojana (BBY)"
        jurisdiction: "HARYANA_STATE_SPECIFIC"
        nodal_agency: "Haryana State Agricultural Marketing Board (HSAMB)"
        description: "Price Deficit Financing scheme insulating farmers against horticultural price crashes"
        mechanism: "State compensates the difference between Government Protected Price (GPP) and actual Mandi sale price"
        protected_horticulture_crops:
          - crop: "Potato"
            protected_price_rs_per_quintal: 600.0
          - crop: "Tomato"
            protected_price_rs_per_quintal: 550.0
          - crop: "Onion"
            protected_price_rs_per_quintal: 800.0
          - crop: "Cauliflower"
            protected_price_rs_per_quintal: 750.0
          - crop: "Carrot"
            protected_price_rs_per_quintal: 700.0

      - scheme_id: "HAR_MERA_PANI_MERI_VIRASAT"
        name: "Haryana Mera Pani Meri Virasat Scheme"
        jurisdiction: "HARYANA_STATE_SPECIFIC"
        description: "Financial incentive for agricultural crop diversification away from water-intensive paddy"
        incentive_structure: "Direct Benefit Transfer (DBT) of ₹7,000 per acre to farmers replacing paddy with Maize, Cotton, Pulses, or Horticulture"

# ==============================================================================
# CROSS-DOMAIN SYNTHESIS ENGINE (HARYANA + AGRI + ENERGY + STORAGE + ECONOMICS)
# ==============================================================================
synthesis_logic:

  computational_models:

    # 1. Cold Storage Unit Economics & Tariff Sensitivity
    - model_id: "MODEL_COLD_CHAIN_TARIFF_ECONOMICS"
      name: "Cold Storage Operating Margin & Electricity Cost Share Model"
      equation_logic: |
        Monthly_Energy_Cost_INR = Capacity_MT * Specific_Energy_Cons_kWh_per_MT * (Energy_Tariff_INR_per_kWh + FSA_INR)
        Gross_Storage_Revenue_INR = Capacity_MT * Occupancy_Rate * Rental_Rate_INR_per_MT_Month
        Net_Operating_Margin = Gross_Storage_Revenue_INR - (Monthly_Energy_Cost_INR + Fixed_Demand_Charges + Labor_Maintenance)
      variables_joined:
        - "DATASET_B_COLD_STORAGE_CAPACITY.installed_capacity_mt"
        - "DATASET_B_COLD_STORAGE_CAPACITY.specific_energy_consumption_kwh_per_mt_month"
        - "DATASET_C_ELECTRICITY_PRICING_TARIFFS.energy_charges_rs_per_kwh"
        - "DATASET_C_ELECTRICITY_PRICING_TARIFFS.fixed_charges_rs_per_kva_month"
      insights_generated:
        - "Electricity represents 32% to 44% of total operating expenditure of cold storages in Haryana under standard commercial LT tariffs."
        - "Adoption of rooftop solar under PM-KUSUM Component A/C reduces effective per-unit energy cost from ₹6.50/kWh to ₹2.80/kWh amortized, improving facility operating margins by 18.5%."

    # 2. Crop Diversification vs Ground Water & Storage Feasibility
    - model_id: "MODEL_CROP_DIVERSIFICATION_WATER_ECONOMICS"
      name: "Paddy to Horticulture Diversification + Storage Buffer Return"
      equation_logic: |
        Baseline_Paddy_Net_Return = (Paddy_Yield * MSP) - (Input_Costs + Subsidized_Pumping_Cost)
        Diversified_Horticulture_Return = (Horticulture_Yield * BBY_Protected_Price) + Mera_Pani_Incentive_7000 - Cold_Storage_Rental - Production_Cost
        Water_Saved_Liters_Per_Acre = Area_Acres * (Paddy_Water_Req - Horticulture_Water_Req)
      variables_joined:
        - "DATASET_A_HARYANA_CROP_PRODUCTION.production_tonnes"
        - "DATASET_A_HARYANA_CROP_PRODUCTION.modal_price_rs_per_quintal"
        - "DATASET_D_AGRICULTURAL_RESEARCH.water_consumption_liters_per_kg_crop"
        - "DATASET_E_GOVERNMENT_POLICIES_SCHEMES.HAR_BHAVANTAR_BHARPAYEE"
        - "DATASET_E_GOVERNMENT_POLICIES_SCHEMES.HAR_MERA_PANI_MERI_VIRASAT"
      insights_generated:
        - "Switching from Paddy to Potato/Tomato in Karnal/Kurukshetra with BBY price floor and cold storage buffer yields an incremental ₹14,200/acre while conserving ~24 Lakh liters of groundwater per acre."

    # 3. Solarized Post-Harvest Cold Room Payback Analysis
    - model_id: "MODEL_SOLAR_COLD_ROOM_PAYBACK"
      name: "PM-KUSUM + PMKSY Co-Funded 5,000 MT Cold Storage Project IRR"
      equation_logic: |
        CapEx_Net = Total_CapEx - (PMKSY_Grant_35pct + State_Topup)
        Annual_Energy_Savings = Annual_Grid_Energy_Cost - (Solar_Generation * Levelized_Cost_of_Solar)
        Post_Harvest_Loss_Saved_INR = Production_MT * (Loss_Without_Storage - Loss_With_Storage) * Mandi_Price
        Payback_Years = CapEx_Net / (Net_Storage_Income + Annual_Energy_Savings + Post_Harvest_Loss_Saved_INR)
      variables_joined:
        - "DATASET_B_COLD_STORAGE_CAPACITY.installed_capacity_mt"
        - "DATASET_C_ELECTRICITY_PRICING_TARIFFS.subsidized_effective_rate_rs_per_kwh"
        - "DATASET_D_AGRICULTURAL_RESEARCH.baseline_post_harvest_loss_pct_without_cold_chain"
        - "DATASET_E_GOVERNMENT_POLICIES_SCHEMES.MOFPI_PM_SAMPADA_COLD_CHAIN"
        - "DATASET_E_GOVERNMENT_POLICIES_SCHEMES.MNRE_PM_KUSUM"
      insights_generated:
        - "A 5,000 MT multi-commodity cold store in Sonipat co-powered by a 150 kW rooftop solar plant achieves full capital payback in 4.2 years (vs 7.8 years for conventional grid-only setup)."

# ==============================================================================
# DISCOVERY & AUDIT VERIFICATION HOOKS
# ==============================================================================
verification_endpoints:
  data_integrity_check: "SHA256_METADATA_SIGNATURE"
  anti_fabrication_rule: "Enforce strict schema validation; discard records where production > 1.5x theoretical historical maximum for Haryana agro-climatic zones."
  auto_citation_builder:
    template: "Source: {custodian} | Dataset: {name} ({temporal_coverage}) | Verified via Bharat Source Registry ({source_registry_ref})"
