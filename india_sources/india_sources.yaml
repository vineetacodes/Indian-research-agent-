      licensing_terms: "National Data Sharing and Accessibility Policy (NDSAP) - Government of India"
      mandatory_disclaimer: "Data sourced from Open Government Data (OGD) Platform India under NDSAP."
    discovery_protocol:
      method: "CATALOG_API_SEARCH"
