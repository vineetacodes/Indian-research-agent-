#
# OPERATIONAL INVARIANTS:
# 1. Zero Data Fabrication: Under no circumstances shall synthetic or imaginary data
#    be generated for unavailable records or inaccessible endpoints.
# 2. Strict Legal & Technical Compliance: Always observe robots.txt, terms of service,
#    authentication policies, and rate limits. Never attempt bypass or credential spoofing.
# 3. Provenance Primacy: Every extracted data point must carry full provenance metadata
#    (Source ID, Canonical URL, Extraction Timestamp IST, and Credibility Tier).
# ==============================================================================

version: "1.0.0"
registry_metadata:
  name: "Bharat Sovereign & Scholarly Source Registry"
  description: "Deterministic registry of Tier 1-4 data sources for sovereign and scholarly research in India"
  default_timezone: "Asia/Kolkata"
  default_currency: "INR"
  user_agent: "BharatResearchAgent/1.0 (+https://bria.gov.in/bot; contact: tech@bria.gov.in)"

# ==============================================================================
# TIER DEFINITIONS
# ==============================================================================
tiers:
  tier_1:
    label: "Sovereign Indian Government & National Data Layer"
    description: "Official statutory bodies, central banks, ministries, space/scientific councils, and judicial archives"
    credibility_weight: 1.00
    mandatory_verification: true
  tier_2:
    label: "Indian Academic, Scientific & Institutional Repositories"
    description: "Peer-reviewed national repositories, thesis archives, institutional digital libraries, and CSIR journals"
    credibility_weight: 0.90
    mandatory_verification: true
  tier_3:
    label: "Global Scholarly, Bibliographic & Scientific Indices"
    description: "International indexing services, open pre-print repositories, and biomedical citation databases"
    credibility_weight: 0.80
    mandatory_verification: false
  tier_4:
    label: "General Web & Fallback Discovery Layer"
    description: "Verified news, general search engines, and web crawling endpoints"
    credibility_weight: 0.60
    mandatory_verification: false

# ==============================================================================
# REGISTERED SOURCES
# ==============================================================================
