# ==============================================================================
# ROUTING & FALLBACK POLICIES (FIRST-PRINCIPLES FAILSAFE MATRIX)
# ==============================================================================
orchestration_rules:
  priority_order:
    - "Tier-1" # Always query sovereign government sources first for statutory, economic, or policy metrics
    - "Tier-2" # Query national scholarly repositories for academic depth and technical studies
    - "Tier-3" # Query international bibliographic indices for global benchmarks and comparative literature
    - "Tier-4" # Query general web only for real-time breaking events or missing tail topics

  conflict_resolution_precedence:
    rule: "Higher tier strictly overrides lower tier on factual/numerical disputes unless explicitly qualified by date."
    tier_hierarchy:
      Tier-1: 4 # Maximum authority (Acts, Gazettes, Central Bank Series, Supreme Court Decisions)
      Tier-2: 3 # High authority (Peer-reviewed Indian Academy / CSIR / INFLIBNET)
      Tier-3: 2 # Moderate authority (Global scholarly pre-prints and indices)
      Tier-4: 1 # Baseline authority (News, blogs, web pages)

  failover_behavior:
    on_tier_1_unavailable: "Log structured alert; record epistemic uncertainty flag; attempt cached snapshot; fallback to Tier-2 with explicit disclaimer."
    on_rate_limit_exceeded: "Queue request with exponential backoff and jitter; never violate upstream provider limits."
    on_authentication_missing: "Bypass authenticated endpoints gracefully; execute open catalog discovery only."
