  - source_id: "in-gov-ogd-datagov"
    name: "Open Government Data (OGD) Platform India"
    category: "sovereign_open_data"
    priority: "Tier-1"
    jurisdiction: "IN_CENTRAL"
    governing_body: "National Informatics Centre (NIC) / Ministry of Electronics and Information Technology (MeitY)"
    base_url: "https://data.gov.in"
    api_endpoint: "https://api.data.gov.in/resource/"
    catalog_discovery_endpoint: "https://api.data.gov.in/catalog/search"
    access_method: "REST_API"
    api_available: true
    authentication_required: true
    auth_type: "API_KEY_QUERY_PARAM"
    auth_env_var: "OGD_INDIA_API_KEY"
    search_supported: true
    document_supported: true
    supported_formats: ["JSON", "CSV", "XML"]
    rate_limit:
      requests_per_minute: 100
      requests_per_day: 5000
      burst_limit: 10
      concurrency_ceiling: 4
      retry_policy:
        max_retries: 3
        backoff_multiplier: 2.0
        initial_interval_ms: 1000
